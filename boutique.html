<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique — Doppelgänger Roma</title>
<meta name="description" content="Trova la boutique Doppelgänger più vicina: 83 negozi in Italia e nel mondo. Orari, indirizzi, servizi e contatti.">
<link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/looks.css">
<link rel="stylesheet" href="css/boutique.css">
<link rel="stylesheet" href="css/fonts.css">
</head>
<body id="top" class="header-light">

  <div data-layout="header"></div>
  <div data-layout="drawers"></div>

  <main id="main" class="page">

    <section class="hero">
      <div class="hero-inner">
        <h1><span class="hero-line hero-line-main">Le Nostre Boutique</span></h1>
      </div>
    </section>

    <div class="boutique-wrap">

      <p class="boutique-subtitle" id="boutiqueIntro">Utilizza il nostro Store Locator per trovare la Boutique più vicina a te.</p>

      <div class="boutique-toolbar">
        <div class="boutique-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="boutiqueSearch" placeholder="Città o CAP" autocomplete="off" aria-label="Cerca per città o CAP">
        </div>
        <div class="boutique-country-field">
          <label for="boutiqueCountry">Paese</label>
          <div class="select-wrapper">
            <select id="boutiqueCountry" aria-label="Filtra per Paese">
              <option value="">Tutti i Paesi</option>
            </select>
            <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
      </div>

      <p class="boutique-count" id="boutiqueCount" aria-live="polite"></p>

      <div class="boutique-list" id="boutiqueList"></div>

    </div>

  </main>

  <div data-layout="footer"></div>

  <script src="js/layout.js"></script>
  <script src="js/boutiques.js"></script>
  <script src="js/prodotti.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/boutique.js"></script>
</body>
</html>
