<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordine confermato — Doppelgänger Roma</title>
<link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/checkout.css">
<link rel="stylesheet" href="css/conferma.css">
<script>document.documentElement.setAttribute("data-css", "ready");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500;600;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500;600;700&display=swap"></noscript>
</head>
<body class="co-body cf-page">

  <div class="co-header">
    <a href="index.html" aria-label="Home"><img src="images/logo_page.svg" alt="Doppelgänger" class="co-logo"></a>
  </div>

  <div class="co-grid">
    <main class="co-main">
      <svg class="cf-check" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="24" cy="24" r="22"/><path d="M14 25l7 7 13-15"/></svg>
      <p class="cf-kicker">Ordine confermato</p>
      <h1 class="cf-title">Grazie per il tuo ordine</h1>
      <p class="cf-lead">Abbiamo inviato una e-mail di conferma a <strong id="cfEmail"></strong>. Numero ordine: <strong id="cfNum"></strong>.</p>

      <dl class="cf-info">
        <div><dt id="cfConsegnaLabel">Consegna</dt><dd id="cfConsegna"></dd></div>
        <div><dt>Pagamento</dt><dd id="cfPagamento"></dd></div>
      </dl>

      <p class="cf-next" id="cfNext"></p>

      <a href="ai-2026.html" class="cf-btn">Continua gli acquisti</a>
      <p class="co-demo">Demo: questo ordine non è reale e nessun pagamento è stato effettuato.</p>
    </main>

    <aside class="co-side" aria-label="Riepilogo ordine">
      <div class="co-side-in">
        <div id="cfItems"></div>
        <dl class="co-rows">
          <div><dt>Subtotale</dt><dd id="cfSub"></dd></div>
          <div><dt>Spedizione</dt><dd id="cfShip"></dd></div>
          <div class="co-iva"><dt>di cui IVA</dt><dd id="cfIva"></dd></div>
          <div class="co-total"><dt>Totale</dt><dd id="cfTotal"></dd></div>
        </dl>
      </div>
    </aside>
  </div>

  <script src="js/conferma.js"></script>
</body>
</html>
