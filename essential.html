<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Essential — Doppelgänger Roma</title>
<link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/collezione.css">
<link rel="stylesheet" href="css/category.css">
<link rel="stylesheet" href="css/filtri.css">
<script>document.documentElement.setAttribute("data-css", "ready");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500;600;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500;600;700&display=swap"></noscript>
</head>
<body id="top" class="header-light">

  <div data-layout="header"></div>
  <div data-layout="drawers"></div>
  <div data-layout="filters"></div>

  <main class="page">
    <section class="hero">
    </section>

    <section class="products-wrap">
      <button class="filtri-bar" type="button" aria-label="Apri filtri e ordina">
        <span>Filtra e ordina</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M4 6h16M7 12h10M10 18h4"/>
        </svg>
      </button>

      <div class="products-grid">
        <a href="#" class="product-card featured">
          <div class="img-wrap">
            <img src="images/basic-featured.webp" alt="Essential — l'essenziale di ogni giorno">
          </div>
          <div class="featured-overlay">
            <span class="featured-eyebrow">La selezione</span>
            <h3 class="featured-title">L'essenziale<br>di ogni giorno</h3>
          </div>
        </a>

        <a href="#" class="product-card">
          <div class="img-wrap">
            <img src="images/ba4.webp" alt="Maglia uomo girocollo" class="img-main">
            <img src="images/ba4b.webp" alt="Maglia uomo girocollo - vista alternativa" class="img-hover" loading="lazy" decoding="async">
            <button class="wish" type="button" aria-label="Aggiungi ai preferiti"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z"/></svg></button>
          </div>
          <div class="product-info">
            <div class="details"><h3>Maglia uomo girocollo</h3><span class="price">€ 29,99</span></div>
            <button class="plus" type="button" aria-label="Aggiungi">+</button>
          </div>
        </a>

        <a href="#" class="product-card">
          <div class="img-wrap">
            <img src="images/ba1.webp" alt="Maglia uomo dolcevita" class="img-main">
            <img src="images/ba1b.webp" alt="Maglia uomo dolcevita - vista alternativa" class="img-hover" loading="lazy" decoding="async">
            <button class="wish" type="button" aria-label="Aggiungi ai preferiti"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z"/></svg></button>
          </div>
          <div class="product-info">
            <div class="details"><h3>Maglia uomo dolcevita</h3><span class="price">€ 49,99</span></div>
            <button class="plus" type="button" aria-label="Aggiungi">+</button>
          </div>
        </a>

        <a href="#" class="product-card">
          <div class="img-wrap">
            <img src="images/15.webp" alt="Polo uomo in maglia misto lana" class="img-main">
            <img src="images/15b.webp" alt="Polo uomo in maglia misto lana - vista alternativa" class="img-hover" loading="lazy" decoding="async">
            <button class="wish" type="button" aria-label="Aggiungi ai preferiti"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z"/></svg></button>
          </div>
          <div class="product-info">
            <div class="details"><h3>Polo uomo in maglia misto lana</h3><span class="price">€ 39,99</span></div>
            <button class="plus" type="button" aria-label="Aggiungi">+</button>
          </div>
        </a>

        <a href="#" class="product-card">
          <div class="img-wrap">
            <img src="images/ba2.webp" alt="T-shirt uomo" class="img-main">
            <img src="images/ba2b.webp" alt="T-shirt uomo - vista alternativa" class="img-hover" loading="lazy" decoding="async">
            <button class="wish" type="button" aria-label="Aggiungi ai preferiti"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z"/></svg></button>

            <button class="plus" type="button" aria-label="Aggiungi">+</button>

        <a href="#" class="product-card">

            <img src="images/13.webp" alt="Jeans uomo 5 tasche" class="img-main">

            <button class="wish" type="button" aria-label="Aggiungi ai preferiti"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z"/></svg></button>

          <div class="img-wrap">
            <img src="images/10.webp" alt="Shacket uomo sfoderata in velluto" class="img-main">
            <img src="images/10b.webp" alt="Shacket uomo sfoderata in velluto - vista alternativa" class="img-hover" loading="lazy" decoding="async">
            <button class="wish" type="button" aria-label="Aggiungi ai preferiti"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z"/></svg></button>
          </div>
          <div class="product-info">
            <div class="details"><h3>Shacket uomo sfoderata in velluto</h3><span class="price">€ 79,99</span></div>
            <button class="plus" type="button" aria-label="Aggiungi">+</button>
          </div>
        </a>

        <a href="#" class="product-card">
          <div class="img-wrap">
            <img src="images/ba3.webp" alt="Calze uomo natalizie" class="img-main" loading="lazy" decoding="async">
            <img src="images/ba3b.webp" alt="Calze uomo natalizie - vista alternativa" class="img-hover" loading="lazy" decoding="async">
            <button class="wish" type="button" aria-label="Aggiungi ai preferiti"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z"/></svg></button>
          </div>

            <div class="details"><h3>Calze uomo natalizie</h3><span class="price">€ 9,99</span></div>
            <button class="plus" type="button" aria-label="Aggiungi">+</button>
          </div>
        </a>

      <div class="load-more-wrap">
        <button type="button" class="load-more-btn">Altri 36 prodotti</button>
      </div>

  <div data-layout="footer"></div>

  <script src="js/layout.js"></script>
  <script src="js/boutiques.js"></script>

  <script src="js/filtri.js"></script>  <script src="js/nav.js"></script>
