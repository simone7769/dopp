<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crea il tuo account — Doppelgänger Roma</title>
<meta name="description" content="Crea il tuo account Doppelgänger: registrati per gestire ordini, preferiti e vantaggi Club.">
<link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/looks.css">
<link rel="stylesheet" href="css/account.css">
<link rel="stylesheet" href="css/fonts.css">
</head>
<body id="top" class="header-light">

  <div data-layout="header"></div>
  <div data-layout="drawers"></div>

  <main id="main" class="page">

    <section class="hero">
      <div class="hero-inner">
        <h1><span class="hero-line hero-line-main">Crea il tuo account</span></h1>
      </div>
    </section>

    <div class="account-wrap">
      <div class="account-form-wrap">

        <form class="login-form" onsubmit="event.preventDefault(); location.href='account.html';">

          <div class="login-field">
            <label for="regNome">Nome*</label>
            <input type="text" id="regNome" autocomplete="given-name" required>
          </div>

          <div class="login-field">
            <label for="regCognome">Cognome*</label>
            <input type="text" id="regCognome" autocomplete="family-name" required>
          </div>

          <div class="login-field">
            <label for="regEmail">E-mail*</label>
            <input type="email" id="regEmail" autocomplete="email" required>
          </div>

          <div class="login-field">
            <label for="regPassword">Password*</label>
            <div class="password-wrapper">
              <input type="password" id="regPassword" autocomplete="new-password" required minlength="8">
              <button type="button" class="toggle-password" onclick="var i=document.getElementById('regPassword'); i.type = i.type === 'password' ? 'text' : 'password'; this.setAttribute('aria-label', i.type === 'password' ? 'Mostra password' : 'Nascondi password');" aria-label="Mostra password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="login-field">
            <label for="regNascita">Data di nascita (facoltativo)</label>
            <input type="date" id="regNascita" autocomplete="bday">
          </div>

          <div class="contact-privacy" style="margin: 10px 0 0;">
            <label style="display:flex; gap:10px; align-items:flex-start; cursor:pointer;">
              <input type="checkbox" id="regPrivacy" name="privacy" required style="margin-top:4px;">
              <span>Ho letto l'<a href="privacy-cookie.html">Informativa Privacy</a> e accetto il trattamento dei miei dati personali per la gestione dell'account.*</span>
            </label>
          </div>

          <div class="contact-privacy" style="margin: 12px 0 0;">
            <label style="display:flex; gap:10px; align-items:flex-start; cursor:pointer;">
              <input type="checkbox" id="regMarketing" name="marketing" style="margin-top:4px;">
              <span>Desidero ricevere comunicazioni commerciali e newsletter da Doppelgänger (facoltativo).</span>
            </label>
          </div>

          <button type="submit" class="login-btn-primary" style="margin-top: 20px;">Crea account</button>
        </form>

        <p class="account-login-link">
          Hai già un account? <a href="#" onclick="document.querySelector('a[aria-label=\'Profilo\']').click(); return false;">Accedi</a>
        </p>

      </div>
    </div>

  </main>

  <div data-layout="footer"></div>

  <script src="js/layout.js"></script>
  <script src="js/boutiques.js"></script>
  <script src="js/prodotti.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
